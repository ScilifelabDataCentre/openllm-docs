site_name: Documentation
site_description: SciLifeLab's pilot service for access to open-weight large language models
site_url: https://openllm.scilifelab.se/guides/
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  custom_dir: ../theme
  favicon: assets/scilifelab_favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - search.suggest
    - content.code.copy

nav:
  - Overview: index.md
  - Registering an account: registration.md
  - Web interface: web.md
  - Getting started with the API: getting-started-api.md
  - Integration in scripts: scripts.md
  - Integration in agentic systems: agents.md
  - Connect to scientific tools: scientific-tools.md
  - Connect to VS Code: vscode.md
  - Connect to Qwen Code: qwencode.md
  - Connect to Claude Code: claudecode.md
  - Connect to Obsidian: obsidian.md
  - How the service is set up: openllm-setup-advanced.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - ..
      check_paths: true
      dedent_subsections: true
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/about-layout.css
  - stylesheets/about-code.css
  - stylesheets/about-facts.css
  - stylesheets/about-policy.css
