site_name: SciLifeLab OpenLLM
site_description: SciLifeLab's pilot service for open-weight large language models
site_url: https://openllm.scilifelab.se/guides/
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  custom_dir: ../theme
  favicon: assets/scilifelab_favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - content.code.copy

nav:
  - Documentation home: index.md
  - SciLifeLab OpenLLM: about.md
  - Getting started with the API: getting-started-api.md
  - Models: models.md
  - How OpenLLM is set up: openllm-setup-advanced.md
  - Announcements:
      - First announcement: announcement.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - ..
      check_paths: true
      dedent_subsections: true
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/about-layout.css
  - stylesheets/about-code.css
  - stylesheets/about-facts.css
  - stylesheets/about-policy.css
