server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Tiny landing at / so curl-ing the container shows the available paths
    location = / {
        return 200 'OpenLLM docs container. Available paths:\n  /use-policy/\n  /guides/\n';
        add_header Content-Type text/plain;
    }

    # Use-policy site (mkdocs use_directory_urls=true -> clean URLs)
    location /use-policy {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Guides site
    location /guides {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Cache static assets aggressively
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Quiet noisy logs
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
